<head>
    <meta charset="UTF-8">
    <title>جاري التحويل...</title>
    <script>
        // 1. خريطة الروابط المختصرة
        const redirectMap = {
            "muhammed-hossam": "https://shababna-alwaeed.github.io/site/#member-1",
            "mustafa-alalfi": "https://shababna-alwaeed.github.io/site/#member-2",
            "muhammed-samir": "https://shababna-alwaeed.github.io/site/#member-3",
            "yousef-sayed": "https://shababna-alwaeed.github.io/site/#member-4",
            "ahmed-gamal": "https://shababna-alwaeed.github.io/site/#member-5",
            "rumaisa-khaled": "https://shababna-alwaeed.github.io/site/#member-6",
            "mahmoud-tamer": "https://shababna-alwaeed.github.io/site/#member-7",
            "mariem-ehab": "https://shababna-alwaeed.github.io/site/#member-8",
            "abdelrahman-gharib": "https://shababna-alwaeed.github.io/site/#member-14",
            "david-emeil": "https://shababna-alwaeed.github.io/site/#member-15",
            "malak-ahmed": "https://shababna-alwaeed.github.io/site/#member-10",
            "abdelrahman-gamal": "https://shababna-alwaeed.github.io/site/#member-12",
            "mohaned": "https://shababna-alwaeed.github.io/site/#member-9",
            "habiba": "https://shababna-alwaeed.github.io/site/#member-11"
        };

        // الرابط الاحتياطي أو الرئيسي عند دخول الرابط بدون Sub-path
        const homeUrl = "https://shababna-alwaeed.github.io/site/";
        const fallbackUrl = "https://shababna-alwaeed.github.io/site/";

        // 2. قراءة المسار الفرعي
        let currentPath = decodeURIComponent(window.location.pathname)
                            .split('/')
                            .filter(Boolean)
                            .pop() || "";
        
        currentPath = currentPath.toLowerCase().trim();

        // 3. التوجيه بناءً على المسار
        if (currentPath === "my-links" || currentPath === "") {
            // لو دخل على الرابط الرئيسي مباشرة
            window.location.replace(homeUrl);
        } else if (redirectMap[currentPath]) {
            // لو دخل على Sub-path موجود
            window.location.replace(redirectMap[currentPath]);
        } else {
            // لو كتب Sub-path غير موجود
            window.location.replace(fallbackUrl);
        }
    </script>
</head>

</html>
