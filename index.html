        // الرابط الاحتياطي لو المسار غير موجود في القائمة

        // 2. استخراج الكلمة التي بعد آخر سلاش (مثلاً "sasa")
        const currentPath = window.location.pathname.split('/').filter(Boolean).pop();

        // 3. التحويل الفوري السريع
        if (redirectMap[currentPath]) {
            window.location.replace(redirectMap[currentPath]);
        } else {
            window.location.replace(fallbackUrl);
        }
