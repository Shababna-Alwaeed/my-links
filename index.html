<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جاري التحويل...</title>
    <script>
        // 1. خريطة الروابط المختصرة والوجهات (معدلة لتجنب مشاكل المسافات والحروف)
        const redirectMap = {
            "muhammed-hossam": "https://shababna-alwaeed.vercel.app/#leader-1",
            "mustafa-alalfi": "https://shababna-alwaeed.vercel.app/#leader-2",
            "muhammed-samir": "https://shababna-alwaeed.vercel.app/#leader-3",
            "yousef-sayed": "https://shababna-alwaeed.vercel.app/#leader-4",
            "ahmed-gamal": "https://shababna-alwaeed.vercel.app/#leader-5",
            "rumaisa-khaled": "https://shababna-alwaeed.vercel.app/#leader-6",
            "mariem-ehab": "https://shababna-alwaeed.vercel.app/#leader-7",
            "abdelrahman-gharib": "https://shababna-alwaeed.vercel.app/#leader-8",
            "david-emeil": "https://shababna-alwaeed.vercel.app/#leader-9",
            "malak-ahmed": "https://shababna-alwaeed.vercel.app/#leader-10",
            "abdelrahman-gamal": "https://shababna-alwaeed.vercel.app/#leader-11",
            "mohaned": "https://shababna-alwaeed.vercel.app/#leader-12",
            "habiba": "https://shababna-alwaeed.vercel.app/#leader-13"
        };

        const fallbackUrl = "https://shababna-alwaeed.github.io/site";

        // 2. استخراج المسار مع فك تشفير الحروف والمسافات وتحويلها لحروف صغيرة
        let currentPath = decodeURIComponent(window.location.pathname)
                            .split('/')
                            .filter(Boolean)
                            .pop() || "";
        
        currentPath = currentPath.toLowerCase().trim();

        // 3. التحويل الفوري
        if (redirectMap[currentPath]) {
            window.location.replace(redirectMap[currentPath]);
        } else {
            window.location.replace(fallbackUrl);
        }
    </script>
